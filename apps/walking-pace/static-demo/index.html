<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walking Pace Demo | Hyper-Dank</title>
    <script>
      (() => {
        const storageKey = "hyper-dank:theme";
        const getStoredTheme = () => {
          try {
            return window.localStorage.getItem(storageKey);
          } catch {
            return null;
          }
        };
        const stored = getStoredTheme();
        document.documentElement.dataset.theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap"
    />
    <script type="module" src="../src/static-demo/main.ts"></script>
  </head>
  <body>
    <main class="card app-card static-demo" data-fill="true">
      <header class="app-header">
        <div>
          <p class="static-demo-eyebrow">Hyper-Dank static example</p>
          <h1 class="title">Walking Pace Demo</h1>
        </div>
        <div class="account-actions">
          <a class="admin-link" href="../">Docs</a>
          <a class="admin-link" href="../storybook/">Storybook</a>
          <label class="switch" for="theme-toggle" data-variant="compact">
            <span class="switch-label">Color mode</span>
            <input
              id="theme-toggle"
              class="switch-input"
              type="checkbox"
              role="switch"
              aria-label="Color mode"
              aria-checked="false"
              data-theme-toggle
            />
            <span class="switch-track" aria-hidden="true">
              <span class="material-symbols-outlined switch-icon switch-icon-light">light_mode</span>
              <span class="material-symbols-outlined switch-icon switch-icon-dark">dark_mode</span>
              <span class="switch-thumb"></span>
            </span>
          </label>
        </div>
      </header>

      <div class="content-sections">
        <section class="page-section" aria-labelledby="summary-heading">
          <h2 id="summary-heading" class="section-title">Summary</h2>
          <section class="card section-card summary-card" id="stats" aria-live="polite"></section>
        </section>

        <section class="page-section" aria-labelledby="entry-heading">
          <h2 id="entry-heading" class="section-title">Add walk</h2>
          <section class="card section-card form-section">
            <form id="walk-form" class="static-demo-form">
              <div class="input-row">
                <div class="input-group">
                  <label class="input-label" for="miles">Mi</label>
                  <input
                    id="miles"
                    name="miles"
                    type="number"
                    step="0.1"
                    min="0"
                    max="100"
                    placeholder="0.0"
                    required
                  />
                </div>
                <div class="input-group">
                  <label class="input-label" for="minutes">Min</label>
                  <input
                    id="minutes"
                    name="minutes"
                    type="number"
                    min="0"
                    max="100"
                    placeholder="0"
                    required
                  />
                </div>
                <div class="input-group">
                  <label class="input-label" for="seconds">Sec</label>
                  <input
                    id="seconds"
                    name="seconds"
                    type="number"
                    min="0"
                    max="59"
                    placeholder="0"
                    required
                  />
                </div>
                <button class="button" type="submit" data-size="default" data-variant="primary">
                  Add
                </button>
              </div>
              <p id="form-error" class="form-error" hidden></p>
            </form>
          </section>
        </section>

        <section class="page-section" aria-labelledby="history-heading">
          <div id="walks-list" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </body>
</html>

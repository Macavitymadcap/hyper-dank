name: Epic
description: Plan a multi-ticket Hyper-Dank outcome.
title: "hd-0000: "
labels:
  - "type: epic"
body:
  - type: input
    id: identifier
    attributes:
      label: Identifier
      description: Use the next `hd-*` identifier for new GitHub-managed work.
      placeholder: hd-0001
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What outcome should this epic deliver?
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: Goals
      placeholder: |
        - 
        - 
        - 
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What should stay out of this epic?
      placeholder: |
        - 
        - 
  - type: textarea
    id: tickets
    attributes:
      label: Ticket map
      description: Link planned child issues when known.
      placeholder: |
        - [ ] hd-0002
        - [ ] hd-0003
  - type: dropdown
    id: release_impact
    attributes:
      label: Release impact
      options:
        - None
        - Patch
        - Minor
        - Major
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - 
        - 
        - 
    validations:
      required: true
  - type: textarea
    id: durable_docs
    attributes:
      label: Durable docs
      description: Link any Markdown briefs, architecture notes, or historical `pace-*` docs this epic depends on.
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      placeholder: |
        - [ ] `bun run verify`
        - [ ] Screenshots or a11y checks, if user-facing

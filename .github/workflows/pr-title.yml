name: PR Title

on:
  pull_request:
    types:
      - edited
      - opened
      - ready_for_review
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    name: lint-pr-title
    runs-on: ubuntu-latest

    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const title = process.env.PR_TITLE ?? "";
          const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+$/;

          if (!pattern.test(title)) {
            console.error(`PR title must follow Conventional Commits: ${title}`);
            console.error("Examples: feat: add walk summaries, fix(table): align row radius, chore!: reset baseline");
            process.exit(1);
          }
          NODE

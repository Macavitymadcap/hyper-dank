name: Publish npm packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run package checks without staging packages"
        default: "true"
        required: true
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: stage-npm-packages
    runs-on: ubuntu-latest
    environment: npm-publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package metadata
        run: bun run check:publishing

      - name: Build packages
        run: bun run build:packages

      - name: Pack and smoke-test packages
        run: bun run test:packages

      - name: Stage unpublished packages on npm
        if: ${{ github.event_name == 'release' || inputs.dry_run == 'false' }}
        run: |
          published_count=0
          for package_dir in libs/components libs/database libs/http libs/scripts; do
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"

            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "Skipping ${package_name}@${package_version}: version already exists on npm."
              continue
            fi

            echo "Staging ${package_name}@${package_version} from ${package_dir}"
            (cd "${package_dir}" && npm stage publish --access public --provenance)
            published_count=$((published_count + 1))
          done

          if [ "${published_count}" -eq 0 ]; then
            echo "No unpublished package versions found for this release."
          fi

      - name: Dry-run note
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false' }}
        run: echo "Dry run complete. Re-run manually with dry_run=false, or publish a Release Please GitHub release, after npm trusted publishers are configured for every package."

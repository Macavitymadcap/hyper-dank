name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build:
    name: build-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Pages base path
        id: pages-base
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
        run: bun apps/walking-pace/scripts/prepare-pages-source.ts --github-output

      - name: Build Pages artifact
        env:
          PAGES_BASE_PATH: ${{ steps.pages-base.outputs.base_path }}
          PACE_DEMO_BASE: ${{ steps.pages-base.outputs.pace_demo_base }}
        run: bun run build:pages-assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.cache/pages/site

  deploy:
    name: deploy-pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
